<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师节</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: '华文楷体', 'KaiTi', 'Microsoft YaHei', serif;
            background: radial-gradient(circle at 20% 30%, #fde7f0, #fbc4d5 45%, #f59bb6 70%, #e76f9c);
            overflow: hidden;
            position: relative;
        }

        /* ===== 飘浮花瓣/光点 ===== */
        .petal {
            position: absolute;
            font-size: 2rem;
            opacity: 0.6;
            animation: floatPetals linear infinite;
            pointer-events: none;
            user-select: none;
            filter: drop-shadow(0 0 6px rgba(255, 220, 240, 0.7));
            z-index: 1;
        }
        @keyframes floatPetals {
            0% {
                transform: translateY(105vh) rotate(0deg) scale(0.8);
                opacity: 0.7;
            }
            100% {
                transform: translateY(-15vh) rotate(720deg) scale(1.2);
                opacity: 0.15;
            }
        }

        /* ===== 3D 卡片容器 ===== */
        .card-scene {
            perspective: 1200px;
            width: 90%;
            max-width: 620px;
            position: relative;
            z-index: 20;
        }

        .card {
            background: rgba(255, 250, 245, 0.85);
            backdrop-filter: blur(12px);
            padding: 50px 40px 40px;
            border-radius: 68px 28px 68px 28px;
            box-shadow: 0 30px 60px rgba(190, 30, 90, 0.3),
                        0 0 0 2px rgba(255, 240, 245, 0.8) inset,
                        0 0 0 4px rgba(255, 210, 225, 0.5);
            text-align: center;
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.4s;
            transform-style: preserve-3d;
            will-change: transform;
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        /* 悬停3D翻转效果 */
        .card:hover {
            transform: rotateX(2deg) rotateY(-2deg) scale(1.02);
            box-shadow: 0 50px 100px rgba(190, 30, 90, 0.4),
                        0 0 0 3px rgba(255, 200, 220, 0.7) inset;
        }

        /* ===== 卡片内部元素 ===== */
        .icon {
            font-size: 4.6rem;
            line-height: 1.1;
            filter: drop-shadow(0 8px 12px rgba(220, 80, 140, 0.4));
            animation: gentleWave 3s infinite alternate ease-in-out;
            display: inline-block;
        }
        @keyframes gentleWave {
            0% { transform: rotate(-3deg) scale(1); }
            100% { transform: rotate(3deg) scale(1.05); }
        }

        h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, #c2185b, #9c1a4a, #ad1457);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            letter-spacing: 8px;
            margin: 4px 0 0;
            text-shadow: 0 4px 12px rgba(200, 40, 100, 0.25);
            transform: translateZ(20px);
        }

        .sub {
            font-size: 1.15rem;
            color: #6a1b3a;
            margin: 14px 0 10px;
            letter-spacing: 3px;
            border-top: 2px dashed #f48fb1;
            padding-top: 18px;
            font-weight: 400;
            text-shadow: 0 1px 3px #fff8;
        }

        .poem {
            font-size: 1.35rem;
            line-height: 2.3rem;
            color: #4a1a2a;
            margin: 22px 0 26px;
            background: rgba(255, 255, 255, 0.55);
            padding: 22px 18px;
            border-radius: 50px 12px 50px 12px;
            font-style: italic;
            box-shadow: 0 6px 18px rgba(230, 120, 160, 0.15) inset,
                        0 4px 10px rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 230, 240, 0.9);
            transform: translateZ(12px);
        }

        .poem span {
            display: block;
            font-size: 0.95rem;
            color: #7a4a5a;
            margin-top: 10px;
            font-style: normal;
            letter-spacing: 2px;
            opacity: 0.9;
        }

        /* ===== 按钮组 ===== */
        .button-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 6px;
            transform: translateZ(16px);
        }

        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #ec407a, #d81b60);
            color: #fff;
            font-size: 1.15rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 22px rgba(200, 30, 80, 0.4);
            letter-spacing: 2px;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn.secondary {
            background: linear-gradient(135deg, #ba68c8, #9c27b0);
            box-shadow: 0 10px 22px rgba(140, 30, 150, 0.35);
        }

        /* 新增：玄玄语录按钮样式（淡金色/暖调） */
        .btn.quote {
            background: linear-gradient(135deg, #ffb74d, #f57c00);
            box-shadow: 0 10px 22px rgba(230, 120, 20, 0.4);
            border: 1px solid rgba(255, 255, 200, 0.5);
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 16px 30px rgba(200, 30, 80, 0.5);
        }
        .btn.secondary:hover {
            box-shadow: 0 16px 30px rgba(140, 30, 150, 0.5);
        }
        .btn.quote:hover {
            box-shadow: 0 16px 30px rgba(230, 120, 20, 0.6);
        }

        .btn:active {
            transform: scale(0.96);
            box-shadow: 0 4px 10px rgba(200, 30, 80, 0.4);
        }

        /* ===== 惊喜彩蛋区 ===== */
        .surprise {
            margin-top: 24px;
            font-size: 1.8rem;
            min-height: 4rem;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.4s;
            color: #880e4f;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(255, 200, 220, 0.8);
            transform: translateY(6px);
            line-height: 1.4;
        }
        .surprise.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 语录小尾巴（2016.9-2018.6标注） */
        .quote-tag {
            display: inline-block;
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: #a1586b;
            background: rgba(255, 235, 240, 0.8);
            padding: 2px 12px;
            border-radius: 30px;
            margin-left: 10px;
            vertical-align: middle;
            font-weight: normal;
            backdrop-filter: blur(4px);
            border: 1px solid #ffcdd2;
        }

        /* 显示诗词出处小字 */
        .footer-note {
            margin-top: 20px;
            font-size: 0.88rem;
            color: #8a4a5a;
            opacity: 0.7;
            letter-spacing: 1.5px;
            font-style: normal;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .footer-note span {
            background: rgba(255, 240, 245, 0.5);
            padding: 3px 10px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
        }

        /* 卡片内飘落的动态光点（纯CSS装饰） */
        .card::after {
            content: '';
            position: absolute;
            inset: 8px;
            border-radius: 58px 20px 58px 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            pointer-events: none;
        }

        /* 响应式优化 */
        @media (max-width: 520px) {
            .card {
                padding: 36px 22px 32px;
                border-radius: 44px 18px 44px 18px;
            }
            h1 {
                font-size: 2.2rem;
                letter-spacing: 4px;
            }
            .icon {
                font-size: 3.6rem;
            }
            .poem {
                font-size: 1.0rem;
                line-height: 1.9rem;
                padding: 16px 12px;
            }
            .btn {
                font-size: 0.95rem;
                padding: 11px 20px;
            }
            .surprise {
                font-size: 1.4rem;
                min-height: 3rem;
            }
            .sub {
                font-size: 1rem;
                letter-spacing: 2px;
            }
            .quote-tag {
                font-size: 0.7rem;
                padding: 1px 8px;
            }
        }

        @media (max-width: 380px) {
            .button-group {
                flex-direction: column;
                align-items: center;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- 浮动花瓣容器 -->
    <div id="petalsContainer"></div>

    <!-- 3D 卡片场景 -->
    <div class="card-scene">
        <div class="card" id="card">
            <div class="icon">🌹</div>
            <h1>教师节快乐</h1>
            <div class="sub">—— 桃李满天下 · 春晖遍四方 ——</div>

            <div class="poem">
                “ 三尺讲台，三寸舌，三寸笔，三千桃李 ”
                <span>—— 致敬每一位辛勤的园丁</span>
            </div>

            <!-- 按钮组：三个交互按钮（新增玄玄语录） -->
            <div class="button-group">
                <button class="btn" onclick="showSurprise(0)">🌸 点击送祝福</button>
                <button class="btn secondary" onclick="showSurprise(1)">📜 再颂师恩</button>
                <button class="btn quote" onclick="showSurprise(2)">✨ 玄玄语录</button>
            </div>

            <!-- 惊喜消息区：显示文本，玄玄语录时会附带时间标签 -->
            <div class="surprise" id="surpriseMessage">💐 老师，您辛苦了！</div>

            <div class="footer-note">
                <span>✨ 教诲如春风</span>
                <span>✨ 师恩似海深</span>
            </div>
        </div>
    </div>

    <script>
        // ===== 生成浮动花瓣，增强氛围 =====
        function createPetals() {
            const container = document.getElementById('petalsContainer');
            const emojis = ['🌸', '🌺', '🌷', '🌹', '🌻', '🌸', '💮', '🏵️'];
            const count = window.innerWidth < 600 ? 18 : 28;  // 移动端少一点

            for (let i = 0; i < count; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                // 随机选择一个emoji
                petal.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                const size = 1.0 + Math.random() * 2.0;
                petal.style.fontSize = size + 'rem';
                petal.style.left = Math.random() * 98 + '%';
                petal.style.animationDuration = (9 + Math.random() * 16) + 's';
                petal.style.animationDelay = (Math.random() * 16) + 's';
                petal.style.opacity = 0.2 + Math.random() * 0.5;
                // 随机横向飘移感
                petal.style.setProperty('--drift', (Math.random() * 40 - 20) + 'px');
                container.appendChild(petal);
            }
        }
        createPetals();

        // ===== 点击惊喜（多种文案 + 触感反馈）=====
        // 索引 0: 祝福老师  1: 诗词名言  2: 玄玄语录(新增)
        let messageIndex = 0;

        // 玄玄语录专用数组 (带时间标记 2016.9-2018.6)
        const xuanXuanQuotes = [
            '愿你之后的每场梦都不会空',
            '我的语速快吗？我普通话可是国家二级甲！（傲娇）',
            '这天天的！',
            'go out!',
            '口无遮拦！'
        ];

        // 注意: 为避免和上一句重复，我们保留随机逻辑，但不会影响展示。

        const messagesList = [
            [ // 第一组：祝福老师
                '💐 晓玄老师，您辛苦了！',
                '🌟 老师 我想你了',
                '📚 感谢您的谆谆教诲！',
                '🌹 愿您永远健康快乐！',
                '🏆 您是最美的园丁！',
                '💖 师恩如山，永记心间！',
                '🌸 桃李不言，下自成蹊。',
                '📖 春风化雨，润物无声。'
            ],
            [ // 第二组：诗词/名言
                '“新竹高于旧竹枝，全凭老干为扶持。”',
                '“令公桃李满天下，何用堂前更种花。”',
                '“落红不是无情物，化作春泥更护花。”',
                '“忽遇文殊开慧眼，他年应记老师心。”',
                '“偶应非熊兆，尊为帝者师。”',
                '“师者，所以传道授业解惑也。”'
            ],
            [ // 第三组：玄玄语录（加时间标注）
                '愿你之后的每场梦都不会空',
                '我的语速快吗？我普通话可是国家二级甲！（傲娇）',
                '这天天的！',
                'go out!',
                '口无遮拦！'
            ]
        ];

        // 点击时卡片微动反馈
        function cardPulse() {
            const card = document.getElementById('card');
            card.style.transition = 'transform 0.1s';
            card.style.transform = 'scale(0.98) rotateX(1deg)';
            setTimeout(() => {
                card.style.transform = '';
            }, 140);
        }

        // 主函数：type 0 表示祝福按钮，1 表示诗句按钮，2 表示玄玄语录
        function showSurprise(type = 0) {
            const el = document.getElementById('surpriseMessage');
            let selectedArray;
            let isQuote = false; // 是否是玄玄语录

            if (type === 2) {
                // 玄玄语录
                selectedArray = messagesList[2];
                isQuote = true;
            } else if (type === 1) {
                selectedArray = messagesList[1];
            } else {
                selectedArray = messagesList[0];
            }

            // 随机选取一条
            let randomMsg = selectedArray[Math.floor(Math.random() * selectedArray.length)];

            // 如果数组长度>1，避免和当前显示的完全一样（简单去重，忽略带span的情况）
            // 因为玄玄语录现在可能带标签，我们基于原始内容去重，但显示可能加标签
            const currentRawText = el.textContent.replace(/（2016\.9-2018\.6）/g, '').replace(/\s*✨?玄玄✨?\s*/g, '').trim();
            // 如果当前显示包含这条文本且数组长度>1，重新随机一次
            if (selectedArray.length > 1 && randomMsg === currentRawText) {
                randomMsg = selectedArray[Math.floor(Math.random() * selectedArray.length)];
            }

            // 构建显示内容
            let displayHtml = randomMsg;
            if (isQuote) {
                // 添加时间标签 (2016.9-2018.6)
                displayHtml = `${randomMsg} <span class="quote-tag">2016.9-2018.6</span>`;
                // 但el.textContent会丢失html，我们改用innerHTML
            }

            if (isQuote) {
                el.innerHTML = displayHtml;
            } else {
                el.textContent = randomMsg;
            }

            el.classList.add('show');

            // 触发卡片微动
            cardPulse();

            // 额外花瓣飘落效果(小彩蛋) —— 动态增加一个临时花瓣
            const tempPetal = document.createElement('div');
            tempPetal.className = 'petal';
            tempPetal.textContent = ['🌸', '🌺', '🌼', '💮', '🏵️'][Math.floor(Math.random() * 5)];
            tempPetal.style.fontSize = (1.8 + Math.random() * 2) + 'rem';
            tempPetal.style.left = (20 + Math.random() * 60) + '%';
            tempPetal.style.animationDuration = (4 + Math.random() * 4) + 's';
            tempPetal.style.animationDelay = '0s';
            tempPetal.style.opacity = '0.8';
            tempPetal.style.zIndex = '30';
            document.body.appendChild(tempPetal);

            // 移除临时元素，避免堆积
            setTimeout(() => {
                tempPetal.remove();
            }, 6000);
        }

        // 让卡片在鼠标离开后恢复平滑过渡（避免悬停效果卡顿）
        document.getElementById('card').addEventListener('mouseleave', function() {
            this.style.transition = 'transform 0.5s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.4s';
            this.style.transform = '';
        });

        // 因为新增了innerHTML方式，每次显示前确保移除多余的标签？初始消息不含标签，无需处理。
        // 但首次显示时若随机到玄玄语录会有标签，没问题。
    </script>
</body>
</html>
